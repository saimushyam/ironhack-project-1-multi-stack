---
- name: Create deployment directory
  become: true
  ansible.builtin.file:
    path: /opt/voting-app
    state: directory
    mode: "0755"

- name: Deploy tier-specific Compose configuration
  become: true
  ansible.builtin.template:
    src: "{{ 'app-compose.yml.j2' if 'app' in group_names else 'backend-compose.yml.j2' if 'backend' in group_names else 'database-compose.yml.j2' }}"
    dest: /opt/voting-app/compose.yml
    mode: "0600"
  no_log: true

- name: Start tier containers
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: /opt/voting-app
  changed_when: true
